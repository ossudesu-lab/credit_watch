name: test

# 金額計算・判定・記録係のテスト。Upstash もメールも使わないので、秘密は渡さない。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python のテスト
        run: python -m unittest discover -s tests -t . -v

      - name: JS のテスト（記録係）
        run: npm test
